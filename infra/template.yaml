AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Citevia weekly ChatGPT scans - separate API and scanner Lambdas.

Parameters:
  FrontendOrigin:
    Type: String
    Description: Production HTTPS origin without a trailing slash, such as https://app.example.com.
    AllowedPattern: 'https://[A-Za-z0-9.-]+(:[0-9]+)?'
  ApiDomainName:
    Type: String
    Default: ''
    Description: Optional public API hostname, such as api.citevia.io. Leave empty to use the API Gateway hostname.
    AllowedPattern: '^$|[a-z0-9]([a-z0-9.-]*[a-z0-9])?'
  ApiHostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 hosted zone that should receive the API hostname. Required when ApiDomainName is set.
    AllowedPattern: '^$|Z[A-Z0-9]+'
  DevOrigin:
    Type: String
    Default: http://localhost:5173
    AllowedPattern: 'http://localhost:[0-9]+'
  EnableDevOrigin:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable localhost CORS only for a development stack.
  DescopeProjectId:
    Type: String
    Description: Descope project ID used by both the React SDK and API session validation.
    MinLength: 1
    MaxLength: 100
    AllowedPattern: '[A-Za-z0-9_-]+'
  DescopeSecretArn:
    Type: String
    Description: Existing Secrets Manager secret with DESCOPE_MANAGEMENT_KEY (or a raw key), using aws/secretsmanager encryption. API uses it only for user lookup.
    AllowedPattern: 'arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
  DescopeBaseUrl:
    Type: String
    Default: https://api.descope.com
    AllowedPattern: 'https://[A-Za-z0-9.-]+(:[0-9]+)?'
  OpenAiSecretArn:
    Type: String
    Description: Existing Secrets Manager secret ARN containing OPENAI_API_KEY (JSON) or a raw API key. The secret must use the default aws/secretsmanager KMS key.
    AllowedPattern: 'arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
  UnsplashSecretArn:
    Type: String
    Default: ''
    Description: Server-only Unsplash access key, raw or JSON with UNSPLASH_ACCESS_KEY. Required for agent post images.
    AllowedPattern: '^$|arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
  ZernioSecretArn:
    Type: String
    Default: ''
    Description: Optional server-only Zernio key, raw or JSON with ZERNIO_API_KEY, using aws/secretsmanager encryption. Enables connected social accounts and publishing.
    AllowedPattern: '^$|arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
  SocialImageModel:
    Type: String
    Default: gpt-image-2.5-sunburst
    Description: OpenAI Images API model for automated social imagery; independent from manual blog images.
  SocialTextModel:
    Type: String
    Default: ''
    Description: Optional Responses model for social copy, visual style and image review. Empty inherits ContentGenerationModel.
  SocialVideoLayerArn:
    Type: String
    Default: ''
    Description: Optional ARM64 Linux Lambda layer version with /opt/bin/ffmpeg (libx264, drawtext, xfade, zoompan) and /opt/fonts/social.ttf. No video rendering without a compatible layer.
    AllowedPattern: '^$|arn:aws[a-z-]*:lambda:[a-z0-9-]+:[0-9]{12}:layer:[A-Za-z0-9_-]+:[0-9]+'
  GooglePageSpeedSecretArn:
    Type: String
    Default: ''
    Description: Server-only Google PageSpeed API key, raw or JSON with GOOGLE_PAGESPEED_API_KEY. Enables Website Health audits.
    AllowedPattern: '^$|arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
  GoogleCruxSecretArn:
    Type: String
    Default: ''
    Description: Server-only Chrome UX Report API key, raw or JSON with GOOGLE_CRUX_API_KEY. Adds real-user Website Health metrics.
    AllowedPattern: '^$|arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
  PerplexitySecretArn:
    Type: String
    Default: ''
    Description: Existing Secrets Manager secret with PERPLEXITY_API_KEY or a raw key, using aws/secretsmanager encryption. Leave empty until that secret exists.
    AllowedPattern: '^$|arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
  GeminiSecretArn:
    Type: String
    Default: ''
    Description: Existing Secrets Manager secret with GEMINI_API_KEY or a raw key, using aws/secretsmanager encryption. Leave empty until that secret exists.
    AllowedPattern: '^$|arn:[a-z-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
  PerplexityPreset:
    Type: String
    Default: fast@2026-10-16.0
  GeminiGenerationModel:
    Type: String
    Default: gemini-3.8-flash
  GenerationModel:
    Type: String
    Default: gpt-4.1-2025-04-14
    Description: Responses API model supporting the web_search tool. Validate access in your OpenAI project before enabling schedules.
  ContentGenerationModel:
    Type: String
    Default: gpt-6-astra
    Description: Independent Responses API model for agent content creation, web research and editorial revisions. Does not change visibility scans.
  ExtractionModel:
    Type: String
    Default: gemini-3.8-flash
    Description: Answer analysis model with structured output; Gemini uses realtime generateContent and saved OpenAI models remain supported.
  ExtractionFallbackModel:
    Type: String
    Default: ''
    Description: Optional single realtime validation-failure fallback. Never retries an uncertain paid call.
  AnalysisBatchEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Opt in to asynchronous OpenAI analysis for scheduled runs pinned to OpenAI models. Gemini analysis stays realtime.
  AnalysisCacheEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Reuse matching response analysis in the project-scoped evidence cache.
  WriteCompatibilityResults:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Preserve the native compatibility mirror until its consumers are verified; disable explicitly after review.
  CompactRunState:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable after all pre-optimization scanner workers have drained. First release mirrors run state to JSON for mixed-version safety.
  LlmMonthlyBudgetUsd:
    Type: Number
    Default: 70
    MinValue: 0
    Description: Monthly account AI admission allowance in USD; capped by the total account allowance minus infrastructure reserve.
  AccountMonthlyBudgetUsd:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Total monthly account operating-cost target. Shared infrastructure invoices require monthly allocation and reconciliation.
  AccountMonthlyInfraReserveUsd:
    Type: Number
    Default: 30
    MinValue: 0
    Description: Reserve for shared database, storage, API and AWS costs; deducted before admitting AI work.
  LlmGlobalMonthlyBudgetUsd:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Optional whole-application AI admission ceiling. Zero leaves the per-account controls in force without a global ceiling.
  OnboardingModel:
    Type: String
    Default: gpt-4.1-2025-04-14
  AuroraEngineVersion:
    Type: String
    Default: "16.9"
  DatabaseMode:
    Type: String
    Default: aurora
    AllowedValues: [aurora, external]
    Description: Select the existing Aurora database or an externally managed PostgreSQL database. Switching does not migrate data or retire Aurora.
  ExternalDatabaseSecretArn:
    Type: String
    Default: ''
    Description: Existing same-region Secrets Manager secret using aws/secretsmanager, with host,port,database,username,password JSON fields. Credentials never enter template parameters.
    AllowedPattern: '^$|arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+'
  DatabaseMigrationSecretArn:
    Type: String
    Default: ''
    Description: Dedicated migration-only owner credential with a direct PostgreSQL hostname. Never granted to the API or scanner.
    AllowedPattern: '^$|arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+'
  RemoveLegacyNetwork:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Explicit second-stage removal of the legacy NAT gateway, EIP, default route and SSM tunnel after external PostgreSQL is verified. Aurora and its private network remain.
  MaintenanceMode:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Freeze application database writes and pause scanner queue polling/reconciliation during a reviewed database copy or cutover. Drain existing invocations before copying.
  RetireLegacyDatabase:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: After verified external cutover and network cleanup, detach retained Aurora cluster/writer from this stack for explicit operator deletion after a final snapshot. Retain does not delete resources or stop charges.
  AuroraMinCapacity:
    Type: Number
    Default: 0.5
    AllowedValues: [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5, 6, 6.5, 7, 7.5, 8]
    Description: Minimum Aurora Serverless v2 ACUs. Zero opts in to auto-pause on supported engine versions and Regions; review resume latency before enabling.
  AuroraAutoPauseSeconds:
    Type: Number
    Default: 900
    MinValue: 300
    MaxValue: 86400
    Description: Idle seconds before Aurora attempts to pause. Applies only when AuroraMinCapacity is zero; background connections can prevent pausing.
  MaxAccountsPerOwner:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional operations email; confirm the SNS subscription after deployment.
  AlertEmailSecondary:
    Type: String
    Default: ''
    Description: Additional security recipient; must confirm the SNS subscription.
  AlertEmailTertiary:
    Type: String
    Default: ''
    Description: Additional security recipient; must confirm the SNS subscription.
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 180, 365]
  QueueConcurrency:
    Type: Number
    Default: 10
    MinValue: 2
    MaxValue: 98
  ScannerReservedConcurrency:
    Type: Number
    Default: 12
    MinValue: 5
    MaxValue: 100
    Description: Set at least two greater than QueueConcurrency to reserve reconciliation capacity.
  EnableReservedConcurrency:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Reserve API and scanner concurrency. Turn off when the account limit cannot leave 10 unreserved executions.

Conditions:
  IncludeDevOrigin: !Equals [!Ref EnableDevOrigin, 'true']
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasAlertEmailSecondary: !And
    - !Not [!Equals [!Ref AlertEmail, '']]
    - !Not [!Equals [!Ref AlertEmailSecondary, '']]
  HasAlertEmailTertiary: !And
    - !Not [!Equals [!Ref AlertEmail, '']]
    - !Not [!Equals [!Ref AlertEmailTertiary, '']]
  HasMigrationSecret: !Not [!Equals [!Ref DatabaseMigrationSecretArn, '']]
  UseReservedConcurrency: !Equals [!Ref EnableReservedConcurrency, 'true']
  HasApiDomain: !Not [!Equals [!Ref ApiDomainName, '']]
  HasPerplexitySecret: !Not [!Equals [!Ref PerplexitySecretArn, '']]
  HasGeminiSecret: !Not [!Equals [!Ref GeminiSecretArn, '']]
  HasUnsplashSecret: !Not [!Equals [!Ref UnsplashSecretArn, '']]
  HasZernioSecret: !Not [!Equals [!Ref ZernioSecretArn, '']]
  HasSocialTextModel: !Not [!Equals [!Ref SocialTextModel, '']]
  HasSocialVideoLayer: !Not [!Equals [!Ref SocialVideoLayerArn, '']]
  HasGooglePageSpeedSecret: !Not [!Equals [!Ref GooglePageSpeedSecretArn, '']]
  HasGoogleCruxSecret: !Not [!Equals [!Ref GoogleCruxSecretArn, '']]
  AuroraAutoPauseEnabled: !Equals [!Ref AuroraMinCapacity, 0]
  KeepLegacyDatabase: !Not [!Equals [!Ref RetireLegacyDatabase, 'true']]
  UseAuroraDatabase: !And
    - !Equals [!Ref DatabaseMode, aurora]
    - !Not [!Equals [!Ref RetireLegacyDatabase, 'true']]
  HasExternalDatabaseSecret: !Not [!Equals [!Ref ExternalDatabaseSecretArn, '']]
  MaintenanceEnabled: !Equals [!Ref MaintenanceMode, 'true']
  KeepLegacyEgress: !Not
    - !And
      - !Equals [!Ref DatabaseMode, external]
      - !Equals [!Ref RemoveLegacyNetwork, 'true']

Rules:
  ExternalDatabaseRequiresSecret:
    RuleCondition: !Equals [!Ref DatabaseMode, external]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExternalDatabaseSecretArn, '']]
        AssertDescription: External database mode requires an existing Secrets Manager secret ARN.
  LegacyNetworkCleanupRequiresExternalDatabase:
    RuleCondition: !Equals [!Ref RemoveLegacyNetwork, 'true']
    Assertions:
      - Assert: !Equals [!Ref DatabaseMode, external]
        AssertDescription: Legacy network removal is allowed only after selecting external PostgreSQL.
  LegacyDatabaseRetirementRequiresCompletedCutover:
    RuleCondition: !Equals [!Ref RetireLegacyDatabase, 'true']
    Assertions:
      - Assert: !Equals [!Ref DatabaseMode, external]
        AssertDescription: Retiring legacy Aurora requires external PostgreSQL mode.
      - Assert: !Equals [!Ref RemoveLegacyNetwork, 'true']
        AssertDescription: Retiring legacy Aurora requires explicit legacy network cleanup.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Handler: index.handler
    Environment:
      Variables:
        APP_MODE: aws
        DATABASE_MODE: !Ref DatabaseMode
        CITEVIA_MAINTENANCE_MODE: !Ref MaintenanceMode
        DATABASE_HOST: !If [UseAuroraDatabase, !GetAtt Database.Endpoint.Address, !Ref 'AWS::NoValue']
        DATABASE_SECRET_ARN: !If [UseAuroraDatabase, !GetAtt Database.MasterUserSecret.SecretArn, !Ref ExternalDatabaseSecretArn]
        DATABASE_NAME: !If [UseAuroraDatabase, citevia, !Ref 'AWS::NoValue']
        MAX_ACCOUNTS_PER_OWNER: !Ref MaxAccountsPerOwner
        SCAN_RUN_DEADLINE_HOURS: '24'
        SCAN_DISPATCH_MAX_OUTSTANDING: '12'
        SCAN_DISPATCH_MAX_PER_ACCOUNT: '3'
        SCAN_DISPATCH_MAX_PER_PROVIDER: '4'
        EVIDENCE_BUCKET: !Ref EvidenceBucket
        QUEUE_URL: !Ref ScanQueue
        QUEUE_ARN: !GetAtt ScanQueue.Arn
        RETENTION_DAYS: '400'
        ANALYSIS_BATCH_ENABLED: !Ref AnalysisBatchEnabled
        ANALYSIS_CACHE_ENABLED: !Ref AnalysisCacheEnabled
        CITEVIA_WRITE_COMPATIBILITY_RESULTS: !Ref WriteCompatibilityResults
        CITEVIA_COMPACT_RUN_STATE: !Ref CompactRunState
        ANALYSIS_FALLBACK_MODEL: !Ref ExtractionFallbackModel
        LLM_MONTHLY_BUDGET_USD: !Ref LlmMonthlyBudgetUsd
        ACCOUNT_MONTHLY_BUDGET_USD: !Ref AccountMonthlyBudgetUsd
        ACCOUNT_MONTHLY_INFRA_RESERVE_USD: !Ref AccountMonthlyInfraReserveUsd
        LLM_GLOBAL_MONTHLY_BUDGET_USD: !Ref LlmGlobalMonthlyBudgetUsd
        LLM_SOCIAL_IMAGE_RESERVATION_USD: '3'
        LLM_SOCIAL_VISION_RESERVATION_USD: '3'
        LLM_PERPLEXITY_FAST_RESERVATION_USD: '1'

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.48.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  InternetAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway}
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.48.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.48.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.48.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetAttachment
    Properties: {RouteTableId: !Ref PublicRoutes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  PublicAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet, RouteTableId: !Ref PublicRoutes}
  NatAddress:
    Type: AWS::EC2::EIP
    Condition: KeepLegacyEgress
    Properties: {Domain: vpc}
  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: KeepLegacyEgress
    DependsOn: InternetAttachment
    Properties: {AllocationId: !GetAtt NatAddress.AllocationId, SubnetId: !Ref PublicSubnet}
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PrivateRoute:
    Type: AWS::EC2::Route
    Condition: KeepLegacyEgress
    Properties: {RouteTableId: !Ref PrivateRoutes, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatGateway}
  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRoutes}
  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRoutes}
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Citevia Lambda outbound connectivity
      VpcId: !Ref Vpc
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0, Description: Legacy Aurora-mode outbound provider traffic through NAT}]
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL accepts Citevia Lambdas only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref LambdaSecurityGroup, Description: TLS database access from application functions}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref DatabaseTunnelSecurityGroup, Description: IAM-authorized Session Manager database maintenance}
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private PostgreSQL subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  DatabaseParameters:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: Require TLS
      Family: aurora-postgresql16
      Parameters: {rds.force_ssl: '1'}
  Database:
    Type: AWS::RDS::DBCluster
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_162
            comment: Dormant legacy Aurora compatibility resource; production retires it and uses external Neon with a restricted runtime role. Review IAM authentication before re-enabling Aurora.
    Condition: KeepLegacyDatabase
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref AuroraEngineVersion
      DatabaseName: citevia
      MasterUsername: citevia_owner
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      DBClusterParameterGroupName: !Ref DatabaseParameters
      VpcSecurityGroupIds: [!Ref DatabaseSecurityGroup]
      StorageEncrypted: true
      BackupRetentionPeriod: 14
      DeletionProtection: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref AuroraMinCapacity
        MaxCapacity: 8
        SecondsUntilAutoPause: !If [AuroraAutoPauseEnabled, !Ref AuroraAutoPauseSeconds, !Ref 'AWS::NoValue']
  DatabaseWriter:
    Type: AWS::RDS::DBInstance
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_118
            comment: Dormant legacy Aurora compatibility resource; production retires it and monitors external Neon. Configure enhanced monitoring before re-enabling this instance.
    Condition: KeepLegacyDatabase
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBClusterIdentifier: !Ref Database
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true

  DatabaseTunnelRole:
    Type: AWS::IAM::Role
    Condition: KeepLegacyEgress
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  DatabaseTunnelInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: KeepLegacyEgress
    Properties:
      Roles: [!Ref DatabaseTunnelRole]
  DatabaseTunnelSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound Session Manager and PostgreSQL for the Citevia database tunnel
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: Session Manager HTTPS endpoints}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, CidrIp: 10.48.0.0/16, Description: Private TLS PostgreSQL maintenance}
  DatabaseTunnel:
    Type: AWS::EC2::Instance
    Condition: KeepLegacyEgress
    Properties:
      InstanceType: t4g.nano
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      IamInstanceProfile: !Ref DatabaseTunnelInstanceProfile
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds: [!Ref DatabaseTunnelSecurityGroup]
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      Tags: [{Key: Name, Value: citevia-database-tunnel}]

  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LoggingConfiguration:
        DestinationBucketName: !Ref StorageAccessLogs
        LogFilePrefix: evidence/
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration: {Status: Enabled}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendOrigin
              - !If [IncludeDevOrigin, !Ref DevOrigin, !Ref 'AWS::NoValue']
            AllowedMethods: [GET, HEAD, POST]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: EvidenceRetention
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
          # Cached analysis can be recomputed; captured scan evidence keeps its existing retention.
          - Id: AnalysisCacheRetention
            Status: Enabled
            Prefix: analysis-cache/
            ExpirationInDays: 90

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt EvidenceBucket.Arn
              - !Sub '${EvidenceBucket.Arn}/*'
            Condition:
              Bool: {aws:SecureTransport: 'false'}

  StorageAccessLogs:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Dedicated access-log destination; logging this bucket into itself creates recursive log delivery. Public access is blocked and transport/encryption/retention are enforced.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: BoundedAccessLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  StorageAccessLogsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StorageAccessLogs
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ServerAccessLogging
            Effect: Allow
            Principal: {Service: logging.s3.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub '${StorageAccessLogs.Arn}/evidence/*'
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnLike: {aws:SourceArn: !GetAtt EvidenceBucket.Arn}
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt StorageAccessLogs.Arn, !Sub '${StorageAccessLogs.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: 'false'}}

  ScanDeadLetterQueue:
    Type: AWS::SQS::Queue
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_27
            comment: Explicit SqsManagedSseEnabled enables SSE-SQS encryption; this legacy check only recognizes KmsMasterKeyId. No plaintext queue storage is permitted.
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ScanQueue:
    Type: AWS::SQS::Queue
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_27
            comment: Explicit SqsManagedSseEnabled enables SSE-SQS encryption; this legacy check only recognizes KmsMasterKeyId. No plaintext queue storage is permitted.
    Properties:
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScanDeadLetterQueue.Arn
        maxReceiveCount: 5

  QueueTransportPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ScanQueue, !Ref ScanDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTlsOnScanQueue
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt ScanQueue.Arn
            Condition:
              Bool: {aws:SecureTransport: 'false'}
          - Sid: RequireTlsOnDeadLetterQueue
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt ScanDeadLetterQueue.Arn
            Condition:
              Bool: {aws:SecureTransport: 'false'}

  ProjectScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup

  SchedulerQueueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnEquals: {aws:SourceArn: !GetAtt ProjectScheduleGroup.Arn}
      Policies:
        - PolicyName: SendScanJobs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: [!GetAtt ScanQueue.Arn, !GetAtt ScanDeadLetterQueue.Arn]

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt OperationsKey.Arn

  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasApiDomain
    Properties:
      DomainName: !Ref ApiDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiDomainName
          HostedZoneId: !Ref ApiHostedZoneId

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
          - !If [IncludeDevOrigin, !Ref DevOrigin, !Ref 'AWS::NoValue']
        AllowHeaders: [Authorization, Content-Type, Idempotency-Key, MCP-Protocol-Version, X-Workspace-Id]
        ExposeHeaders: [WWW-Authenticate, Retry-After]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","routeKey":"$context.routeKey","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}'

  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiDomain
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificate
          EndpointType: REGIONAL
  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomain
      Stage: $default
  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasApiDomain
    Properties:
      HostedZoneId: !Ref ApiHostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: API Gateway invokes this function synchronously; Lambda asynchronous DLQs do not capture HTTP request failures. API errors are logged and alarmed.
          - id: CKV_AWS_173
            comment: Environment contains nonsecret configuration and Secrets Manager ARNs; credential values are fetched with scoped IAM. Lambda supplies encryption at rest with its AWS managed key.
    Properties:
      CodeUri: ../dist/api/
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, 20, !Ref 'AWS::NoValue']
      VpcConfig: !If
        - UseAuroraDatabase
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        - !Ref 'AWS::NoValue'
      MemorySize: 512
      Timeout: 29
      Environment:
        Variables:
          DESCOPE_PROJECT_ID: !Ref DescopeProjectId
          DESCOPE_SECRET_ARN: !Ref DescopeSecretArn
          DESCOPE_BASE_URL: !Ref DescopeBaseUrl
          UNSPLASH_SECRET_ARN: !Ref UnsplashSecretArn
          ZERNIO_SECRET_ARN: !Ref ZernioSecretArn
          SOCIAL_VIDEO_CONFIGURED: !If [HasSocialVideoLayer, 'true', 'false']
          GOOGLE_PAGESPEED_SECRET_ARN: !Ref GooglePageSpeedSecretArn
          GOOGLE_CRUX_SECRET_ARN: !Ref GoogleCruxSecretArn
          OPENAI_SECRET_ARN: !Ref OpenAiSecretArn
          PERPLEXITY_SECRET_ARN: !Ref PerplexitySecretArn
          GEMINI_SECRET_ARN: !Ref GeminiSecretArn
          OPENAI_GENERATION_MODEL: !Ref GenerationModel
          OPENAI_CONTENT_MODEL: !Ref ContentGenerationModel
          ANALYSIS_MODEL: !Ref ExtractionModel
          PERPLEXITY_PRESET: !Ref PerplexityPreset
          GEMINI_GENERATION_MODEL: !Ref GeminiGenerationModel
          ALLOWED_ORIGIN: !Ref FrontendOrigin
          MCP_PUBLIC_URL: !If
            - HasApiDomain
            - !Sub 'https://${ApiDomainName}'
            - ''
          MCP_ALLOWED_ORIGINS: !If [IncludeDevOrigin, !Ref DevOrigin, '']
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerQueueRole.Arn
          SCHEDULE_GROUP: !Ref ProjectScheduleGroup
          DLQ_ARN: !GetAtt ScanDeadLetterQueue.Arn
          API_USER_READS_PER_MINUTE: '600'
          API_USER_WRITES_PER_MINUTE: '120'
          API_ACCOUNT_READS_PER_MINUTE: '1200'
          API_ACCOUNT_WRITES_PER_MINUTE: '240'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !If [UseAuroraDatabase, !GetAtt Database.MasterUserSecret.SecretArn, !If [HasExternalDatabaseSecret, !Ref ExternalDatabaseSecretArn, !Ref 'AWS::NoValue']]
                - !Ref DescopeSecretArn
            - !If
              - HasZernioSecret
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ZernioSecretArn
              - !Ref 'AWS::NoValue'
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${EvidenceBucket.Arn}/*'
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObjectVersion]
              Resource: !Sub '${EvidenceBucket.Arn}/projects/*/social/*'
            # Missing-object probes return 404 only when the caller can list this bucket.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt EvidenceBucket.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt ScanQueue.Arn
            - Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:UpdateSchedule, scheduler:DeleteSchedule, scheduler:GetSchedule]
              Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ProjectScheduleGroup}/*'
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerQueueRole.Arn
              Condition:
                StringEquals: {iam:PassedToService: scheduler.amazonaws.com}
      Events:
        Root:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /, Method: ANY, PayloadFormatVersion: '2.0'}
        Proxy:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/{proxy+}', Method: ANY, PayloadFormatVersion: '2.0'}

  ScannerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_173
            comment: Environment contains nonsecret configuration and Secrets Manager ARNs; credential values are fetched with scoped IAM. Lambda supplies encryption at rest with its AWS managed key.
    Properties:
      CodeUri: ../dist/scanner/
      # Completing a job intentionally dispatches the next bounded SQS job.
      # Default recursion protection stops this chain after about 16 invocations.
      # Database admission, attempt budgets and deadlines remain authoritative.
      RecursiveLoop: Allow
      # SQS work uses the source queue redrive policy; these settings cover the
      # independent asynchronous EventBridge reconciliation invocations.
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ScanDeadLetterQueue.Arn
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600
      VpcConfig: !If
        - UseAuroraDatabase
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        - !Ref 'AWS::NoValue'
      MemorySize: !If [HasSocialVideoLayer, 2048, 1024]
      EphemeralStorage:
        Size: !If [HasSocialVideoLayer, 1024, 512]
      Layers: !If [HasSocialVideoLayer, [!Ref SocialVideoLayerArn], !Ref 'AWS::NoValue']
      Timeout: 300
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, !Ref ScannerReservedConcurrency, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          OPENAI_SECRET_ARN: !Ref OpenAiSecretArn
          OPENAI_GENERATION_MODEL: !Ref GenerationModel
          OPENAI_CONTENT_MODEL: !Ref ContentGenerationModel
          OPENAI_SOCIAL_TEXT_MODEL: !If [HasSocialTextModel, !Ref SocialTextModel, !Ref ContentGenerationModel]
          OPENAI_SOCIAL_IMAGE_MODEL: !Ref SocialImageModel
          FFMPEG_PATH: !If [HasSocialVideoLayer, /opt/bin/ffmpeg, !Ref 'AWS::NoValue']
          SOCIAL_FONT_PATH: !If [HasSocialVideoLayer, /opt/fonts/social.ttf, !Ref 'AWS::NoValue']
          ANALYSIS_MODEL: !Ref ExtractionModel
          OPENAI_ONBOARDING_MODEL: !Ref OnboardingModel
          UNSPLASH_SECRET_ARN: !Ref UnsplashSecretArn
          ZERNIO_SECRET_ARN: !Ref ZernioSecretArn
          GOOGLE_PAGESPEED_SECRET_ARN: !Ref GooglePageSpeedSecretArn
          GOOGLE_CRUX_SECRET_ARN: !Ref GoogleCruxSecretArn
          PERPLEXITY_SECRET_ARN: !Ref PerplexitySecretArn
          GEMINI_SECRET_ARN: !Ref GeminiSecretArn
          PERPLEXITY_PRESET: !Ref PerplexityPreset
          GEMINI_GENERATION_MODEL: !Ref GeminiGenerationModel
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerQueueRole.Arn
          SCHEDULE_GROUP: !Ref ProjectScheduleGroup
          DLQ_ARN: !GetAtt ScanDeadLetterQueue.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - !If
              - UseAuroraDatabase
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
              - !If
                - HasExternalDatabaseSecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref ExternalDatabaseSecretArn
                - !Ref 'AWS::NoValue'
            - !If
              - HasUnsplashSecret
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref UnsplashSecretArn
              - !Ref 'AWS::NoValue'
            - !If
              - HasZernioSecret
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ZernioSecretArn
              - !Ref 'AWS::NoValue'
            - !If
              - HasGooglePageSpeedSecret
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GooglePageSpeedSecretArn
              - !Ref 'AWS::NoValue'
            - !If
              - HasGoogleCruxSecret
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GoogleCruxSecretArn
              - !Ref 'AWS::NoValue'
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub '${EvidenceBucket.Arn}/*'
            - Effect: Allow
              Action: s3:GetObjectVersion
              Resource: !Sub '${EvidenceBucket.Arn}/projects/*/social/*'
            # Checkpoint reads must distinguish an absent object from access denied.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt EvidenceBucket.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !If
                - HasPerplexitySecret
                - !If
                  - HasGeminiSecret
                  - [!Ref OpenAiSecretArn, !Ref PerplexitySecretArn, !Ref GeminiSecretArn]
                  - [!Ref OpenAiSecretArn, !Ref PerplexitySecretArn]
                - !If
                  - HasGeminiSecret
                  - [!Ref OpenAiSecretArn, !Ref GeminiSecretArn]
                  - [!Ref OpenAiSecretArn]
            - Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:UpdateSchedule, scheduler:DeleteSchedule, scheduler:GetSchedule]
              Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ProjectScheduleGroup}/*'
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerQueueRole.Arn
              Condition:
                StringEquals: {iam:PassedToService: scheduler.amazonaws.com}
            - Effect: Allow
              Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
              Resource: !GetAtt ScanQueue.Arn
      Events:
        ScanJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt ScanQueue.Arn
            Enabled: !If [MaintenanceEnabled, false, true]
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: {MaximumConcurrency: !Ref QueueConcurrency}
        Reconcile:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Input: '{"kind":"reconcile"}'
            State: !If [MaintenanceEnabled, DISABLED, ENABLED]
        SocialReconcile:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Input: '{"kind":"social-reconcile"}'
            State: !If [MaintenanceEnabled, DISABLED, ENABLED]
        GeoBacklinksReconcile:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Input: '{"kind":"geo-backlinks-reconcile"}'
            State: !If [MaintenanceEnabled, DISABLED, ENABLED]

  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt OperationsKey.Arn

  ScannerFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ScannerFunction}'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt OperationsKey.Arn

  MigrationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: This account quota cannot reserve concurrency while retaining the AWS-required unreserved capacity. Only deployment IAM can invoke migrations; a PostgreSQL advisory lock serializes execution and the migration pool has one connection.
          - id: CKV_AWS_116
            comment: Deployment invokes migrations synchronously and fails on the returned result; asynchronous Lambda DLQs do not apply. The function has no asynchronous event sources.
          - id: CKV_AWS_173
            comment: Environment contains nonsecret configuration and a migration-secret ARN; the credential is fetched with scoped IAM. Lambda supplies encryption at rest with its AWS managed key.
    Properties:
      CodeUri: ../dist/migrations/
      MemorySize: 512
      Timeout: 300
      VpcConfig: !If
        - UseAuroraDatabase
        - SecurityGroupIds: [!Ref LambdaSecurityGroup]
          SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        - !Ref 'AWS::NoValue'
      Environment:
        Variables:
          DATABASE_MIGRATION_SECRET_ARN: !If [UseAuroraDatabase, !GetAtt Database.MasterUserSecret.SecretArn, !Ref DatabaseMigrationSecretArn]
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !If [UseAuroraDatabase, !GetAtt Database.MasterUserSecret.SecretArn, !If [HasMigrationSecret, !Ref DatabaseMigrationSecretArn, !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:unconfigured-migration']]
  MigrationFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${MigrationFunction}'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt OperationsKey.Arn

  OperationsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Citevia operational logs and encrypted alarm delivery
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: kms:*
            Resource: '*'
          - Sid: StackLogEncryption
            Effect: Allow
            Principal: {Service: !Sub 'logs.${AWS::Region}.amazonaws.com'}
            Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${AWS::StackName}-*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*'
          - Sid: CloudWatchAlarmDelivery
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: [kms:Decrypt, kms:GenerateDataKey*]
            Resource: '*'
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnLike: {aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*'}

  Alerts:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      KmsMasterKeyId: !GetAtt OperationsKey.Arn
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
  AlertSecondarySubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmailSecondary
    Properties: {TopicArn: !Ref Alerts, Protocol: email, Endpoint: !Ref AlertEmailSecondary}
  AlertTertiarySubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmailTertiary
    Properties: {TopicArn: !Ref Alerts, Protocol: email, Endpoint: !Ref AlertEmailTertiary}
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasAlertEmail
    Properties:
      Topics: [!Ref Alerts]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: [sns:GetTopicAttributes, sns:SetTopicAttributes, sns:AddPermission, sns:RemovePermission, sns:DeleteTopic, sns:Subscribe, sns:ListSubscriptionsByTopic, sns:Publish]
            Resource: !Ref Alerts
          - Sid: CloudWatchAlarms
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref Alerts
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
              ArnLike: {aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*'}
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: sns:Publish
            Resource: !Ref Alerts
            Condition: {Bool: {aws:SecureTransport: 'false'}}

  ApiHttpErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API returned at least three HTTP 5xx responses, including handled application failures.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{Name: ApiId, Value: !Ref HttpApi}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref Alerts], []]
  ApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Lambda concurrency exhaustion; check account quota and scanner load.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref Alerts], []]
  ScannerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Background processing is throttled; check quota, job deadlines and queue age.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref ScannerFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref Alerts], []]
  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API p95 latency exceeds ten seconds for ten minutes.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions: [{Name: ApiId, Value: !Ref HttpApi}]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref Alerts], []]
  CostPersistenceFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ScannerFunctionLogs
      FilterPattern: '{ $.event = "provider_cost_outcome_unsaved" }'
      MetricTransformations:
        - MetricNamespace: !Sub 'Citevia/${AWS::StackName}'
          MetricName: CostPersistenceFailures
          MetricValue: '1'
          DefaultValue: 0
  CostPersistenceFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A paid provider outcome could not be recorded. Reservation is retained; reconcile billing before retrying.
      Namespace: !Sub 'Citevia/${AWS::StackName}'
      MetricName: CostPersistenceFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref Alerts], []]
  BudgetDenialMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ScannerFunctionLogs
      FilterPattern: '{ $.event = "provider_budget_denied" }'
      MetricTransformations:
        - MetricNamespace: !Sub 'Citevia/${AWS::StackName}'
          MetricName: ProviderBudgetDenials
          MetricValue: '1'
          DefaultValue: 0
  BudgetDenialAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Paid work was stopped by a budget or missing price. Review the account cost report and unresolved holds before authorizing more spend.
      Namespace: !Sub 'Citevia/${AWS::StackName}'
      MetricName: ProviderBudgetDenials
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref Alerts], []]

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scan messages exhausted retries or schedule delivery failed. Inspect the DLQ and reconcile run status before retrying.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt ScanDeadLetterQueue.QueueName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref Alerts], []]

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scan queue has work more than two hours old; inspect throttling, provider errors and concurrency.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - {Name: QueueName, Value: !GetAtt ScanQueue.QueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 7200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref Alerts], []]

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Lambda unhandled errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref ApiFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref Alerts], []]

  ScannerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scanner Lambda unhandled errors or timeouts. Handled item failures are also visible in scan results and the DLQ alarm.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref ScannerFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref Alerts], []]

Outputs:
  ApiUrl:
    Value: !If
      - HasApiDomain
      - !Sub 'https://${ApiDomainName}'
      - !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  DescopeProjectId:
    Value: !Ref DescopeProjectId
  DescopeBaseUrl:
    Value: !Ref DescopeBaseUrl
  DatabaseHost:
    Condition: UseAuroraDatabase
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !If [UseAuroraDatabase, !GetAtt Database.MasterUserSecret.SecretArn, !Ref ExternalDatabaseSecretArn]
  DatabaseName:
    Condition: UseAuroraDatabase
    Value: citevia
  ActiveDatabaseMode:
    Value: !Ref DatabaseMode
  LegacyDatabaseHost:
    Condition: KeepLegacyDatabase
    Description: Retained Aurora endpoint for reviewed migration or rollback. External mode continues to retain and bill Aurora.
    Value: !GetAtt Database.Endpoint.Address
  LegacyDatabaseSecretArn:
    Condition: KeepLegacyDatabase
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  LegacyDatabaseRetired:
    Description: True means Aurora was detached under Retain. Verify its physical deletion separately; this flag does not prove billing stopped.
    Value: !Ref RetireLegacyDatabase
  DatabaseTunnelInstanceId:
    Condition: KeepLegacyEgress
    Description: Private Session Manager target used to forward PostgreSQL to a local port.
    Value: !Ref DatabaseTunnel
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  ScanQueueUrl:
    Value: !Ref ScanQueue
  ScanQueueArn:
    Value: !GetAtt ScanQueue.Arn
  DeadLetterQueueUrl:
    Value: !Ref ScanDeadLetterQueue
  DeadLetterQueueArn:
    Value: !GetAtt ScanDeadLetterQueue.Arn
  ScheduleGroupName:
    Value: !Ref ProjectScheduleGroup
  SchedulerRoleArn:
    Value: !GetAtt SchedulerQueueRole.Arn
  ApiFunctionName:
    Value: !Ref ApiFunction
  ScannerFunctionName:
    Value: !Ref ScannerFunction
  MigrationFunctionName:
    Value: !Ref MigrationFunction
  AlertsTopicArn:
    Condition: HasAlertEmail
    Value: !Ref Alerts

version = 0.1

[default.deploy.parameters]
stack_name = "citevia-production"
region = "eu-west-1"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
# Copy to infra/samconfig.toml and fill in real values. Secret ARN only, never a key.
parameter_overrides = "ExtractionModel=gemini-3.8-flash FrontendOrigin=https://app.example.com DescopeProjectId=YOUR_DESCOPE_PROJECT_ID DescopeSecretArn=arn:aws:secretsmanager:eu-west-1:123456789012:secret:citevia/descope-ABCDEF OpenAiSecretArn=arn:aws:secretsmanager:eu-west-1:123456789012:secret:citevia/openai-ABCDEF UnsplashSecretArn=arn:aws:secretsmanager:eu-west-1:123456789012:secret:citevia/unsplash-ABCDEF PerplexitySecretArn=arn:aws:secretsmanager:eu-west-1:123456789012:secret:citevia/perplexity-ABCDEF GeminiSecretArn=arn:aws:secretsmanager:eu-west-1:123456789012:secret:citevia/gemini-ABCDEF ContentGenerationModel=gpt-6-astra EnableDevOrigin=false"

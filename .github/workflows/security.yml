name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '19 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency vulnerabilities and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts
      - name: Generate CycloneDX software bill of materials
        run: |
          mkdir -p security-reports
          npm sbom --sbom-format cyclonedx > security-reports/sbom.cdx.json
      - name: Reject known moderate, high or critical vulnerabilities
        run: npm run security:audit
      - name: Retain dependency inventory for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-sbom
          path: security-reports/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: Secrets in Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Scan history with checksum-verified Gitleaks
        run: npm run security:secrets

  infrastructure:
    name: CloudFormation security policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BC_SKIP_MAPPING: 'true'
      CHECKOV_NO_CACHE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install the reviewed infrastructure scanner
        run: |
          python -m venv .security-tools
          .security-tools/bin/pip install --disable-pip-version-check checkov==3.4.3
      - name: Check CloudFormation security policies
        run: .security-tools/bin/checkov --file infra/template.yaml infra/security-account.yaml --framework cloudformation --skip-download

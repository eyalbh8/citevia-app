name: Deploy AWS backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing reviewed deployment variables
        type: environment
        required: true
      stack_name:
        description: CloudFormation stack name
        type: string
        default: citevia-production
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.stack_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_NAME: ${{ inputs.stack_name }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      CLOUDFORMATION_ROLE_ARN: ${{ vars.CLOUDFORMATION_ROLE_ARN }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      DESCOPE_PROJECT_ID: ${{ vars.DESCOPE_PROJECT_ID }}
      DESCOPE_SECRET_ARN: ${{ vars.DESCOPE_SECRET_ARN }}
      DESCOPE_BASE_URL: ${{ vars.DESCOPE_BASE_URL || 'https://api.descope.com' }}
      VITE_LOGO_DEV_API_KEY: ${{ vars.VITE_LOGO_DEV_API_KEY }}
      OPENAI_SECRET_ARN: ${{ vars.OPENAI_SECRET_ARN }}
      UNSPLASH_SECRET_ARN: ${{ vars.UNSPLASH_SECRET_ARN }}
      PERPLEXITY_SECRET_ARN: ${{ vars.PERPLEXITY_SECRET_ARN }}
      GEMINI_SECRET_ARN: ${{ vars.GEMINI_SECRET_ARN }}
      GOOGLE_PAGESPEED_SECRET_ARN: ${{ vars.GOOGLE_PAGESPEED_SECRET_ARN }}
      GOOGLE_CRUX_SECRET_ARN: ${{ vars.GOOGLE_CRUX_SECRET_ARN }}
      PERPLEXITY_PRESET: ${{ vars.PERPLEXITY_PRESET || 'fast@2026-10-16.0' }}
      GEMINI_GENERATION_MODEL: ${{ vars.GEMINI_GENERATION_MODEL || 'gemini-3.8-flash' }}
      GENERATION_MODEL: ${{ vars.OPENAI_GENERATION_MODEL || 'gpt-4.1-2025-04-14' }}
      CONTENT_MODEL: ${{ vars.OPENAI_CONTENT_MODEL || 'gpt-6-astra' }}
      EXTRACTION_MODEL: ${{ vars.ANALYSIS_MODEL || 'gemini-3.8-flash' }}
      EXTRACTION_FALLBACK_MODEL: ${{ vars.ANALYSIS_FALLBACK_MODEL }}
      ANALYSIS_BATCH_ENABLED: ${{ vars.ANALYSIS_BATCH_ENABLED }}
      ANALYSIS_CACHE_ENABLED: ${{ vars.ANALYSIS_CACHE_ENABLED || 'true' }}
      WRITE_COMPATIBILITY_RESULTS: ${{ vars.CITEVIA_WRITE_COMPATIBILITY_RESULTS || 'true' }}
      COMPACT_RUN_STATE: ${{ vars.CITEVIA_COMPACT_RUN_STATE }}
      LLM_MONTHLY_BUDGET_USD: ${{ vars.LLM_MONTHLY_BUDGET_USD || '0' }}
      AURORA_MIN_CAPACITY: ${{ vars.AURORA_MIN_CAPACITY || '1' }}
      AURORA_AUTO_PAUSE_SECONDS: ${{ vars.AURORA_AUTO_PAUSE_SECONDS || '900' }}
      # Blank values inherit the current stack selection, preventing later deploys from undoing a cutover.
      DATABASE_MODE: ${{ vars.DATABASE_MODE }}
      EXTERNAL_DATABASE_SECRET_ARN: ${{ vars.EXTERNAL_DATABASE_SECRET_ARN }}
      REMOVE_LEGACY_NETWORK: ${{ vars.REMOVE_LEGACY_NETWORK }}
      MAINTENANCE_MODE: ${{ vars.CITEVIA_MAINTENANCE_MODE }}
      RETIRE_LEGACY_DATABASE: ${{ vars.RETIRE_LEGACY_DATABASE }}
      ONBOARDING_MODEL: ${{ vars.OPENAI_ONBOARDING_MODEL || 'gpt-4.1-2025-04-14' }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      SAM_CLI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check deployment configuration
        shell: bash
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          for setting in AWS_REGION STACK_NAME ARTIFACT_BUCKET CLOUDFORMATION_ROLE_ARN FRONTEND_ORIGIN DESCOPE_PROJECT_ID DESCOPE_SECRET_ARN OPENAI_SECRET_ARN PERPLEXITY_SECRET_ARN GEMINI_SECRET_ARN DEPLOY_ROLE_ARN; do
            if [[ -z "${!setting}" ]]; then
              echo "Missing GitHub environment variable: $setting" >&2
              exit 1
            fi
          done
          [[ "$STACK_NAME" =~ ^[A-Za-z][A-Za-z0-9-]{0,79}$ ]]
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - name: Validate template
        run: sam validate --template-file infra/template.yaml --lint
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: citevia-deploy-${{ github.run_id }}
      - name: Resolve database deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          parameter_file="$(mktemp "${RUNNER_TEMP:-/tmp}/citevia-db-parameters.XXXXXX")"
          error_file="$(mktemp "${RUNNER_TEMP:-/tmp}/citevia-db-error.XXXXXX")"
          trap 'rm -f "$parameter_file" "$error_file"' EXIT
          if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Parameters' --output json > "$parameter_file" 2> "$error_file"; then
            if node -e 'const fs=require("node:fs");process.exit(/Stack with id .+ does not exist/.test(fs.readFileSync(process.argv[1],"utf8"))?0:1)' "$error_file"; then
              echo '[]' > "$parameter_file"
            else
              cat "$error_file" >&2
              exit 1
            fi
          fi
          read_parameter() {
            node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(p.find(x=>x.ParameterKey===process.argv[2])?.ParameterValue||"")' "$parameter_file" "$1"
          }
          deployed_mode="$(read_parameter DatabaseMode)"
          selected_mode="${DATABASE_MODE:-${deployed_mode:-aurora}}"
          selected_secret="${EXTERNAL_DATABASE_SECRET_ARN:-$(read_parameter ExternalDatabaseSecretArn)}"
          selected_cleanup="${REMOVE_LEGACY_NETWORK:-$(read_parameter RemoveLegacyNetwork)}"
          selected_cleanup="${selected_cleanup:-false}"
          selected_maintenance="${MAINTENANCE_MODE:-$(read_parameter MaintenanceMode)}"
          selected_maintenance="${selected_maintenance:-false}"
          selected_compact_state="${COMPACT_RUN_STATE:-$(read_parameter CompactRunState)}"
          selected_compact_state="${selected_compact_state:-false}"
          selected_batch="${ANALYSIS_BATCH_ENABLED:-$(read_parameter AnalysisBatchEnabled)}"
          selected_batch="${selected_batch:-false}"
          deployed_retirement="$(read_parameter RetireLegacyDatabase)"
          selected_retirement="${RETIRE_LEGACY_DATABASE:-${deployed_retirement:-false}}"
          if [[ ! "$selected_mode" =~ ^(aurora|external)$ || ! "$selected_cleanup" =~ ^(true|false)$ || ! "$selected_maintenance" =~ ^(true|false)$ || ! "$selected_compact_state" =~ ^(true|false)$ || ! "$selected_retirement" =~ ^(true|false)$ || ! "$selected_batch" =~ ^(true|false)$ ]]; then
            echo 'Database mode, cleanup flag, maintenance flag, compact run state flag, retirement flag or analysis batch flag is invalid.' >&2
            exit 1
          fi
          if [[ ( "$selected_mode" == external || -n "$selected_secret" ) && ! "$selected_secret" =~ ^arn:aws[a-z-]*:secretsmanager:${AWS_REGION}:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$ ]]; then
            echo 'External database mode requires a same-region Secrets Manager secret ARN; credentials must remain in that secret.' >&2
            exit 1
          fi
          if [[ "$selected_cleanup" == true && ( "$selected_mode" != external || "$deployed_mode" != external ) ]]; then
            echo 'Deploy and verify external database mode before requesting a separate legacy-network cleanup deployment.' >&2
            exit 1
          fi
          if [[ "$selected_retirement" == true && ( "$selected_mode" != external || "$selected_cleanup" != true || "$deployed_mode" != external ) ]]; then
            echo 'Legacy database retirement requires an already deployed external database and explicit legacy-network cleanup.' >&2
            exit 1
          fi
          if [[ "$deployed_retirement" == true && "$selected_retirement" != true ]]; then
            echo 'Retained Aurora cannot be reattached by clearing the retirement flag. Use a reviewed restore/import procedure.' >&2
            exit 1
          fi
          # Preserve optional Website Health credentials when a later deploy leaves its variables unset.
          selected_pagespeed="${GOOGLE_PAGESPEED_SECRET_ARN:-$(read_parameter GooglePageSpeedSecretArn)}"
          selected_crux="${GOOGLE_CRUX_SECRET_ARN:-$(read_parameter GoogleCruxSecretArn)}"
          for health_secret in "$selected_pagespeed" "$selected_crux"; do
            if [[ -n "$health_secret" && ! "$health_secret" =~ ^arn:aws[a-z-]*:secretsmanager:${AWS_REGION}:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$ ]]; then
              echo 'Website Health credentials must be same-region Secrets Manager ARNs.' >&2
              exit 1
            fi
          done
          printf '%s\n' "DATABASE_MODE=$selected_mode" "EXTERNAL_DATABASE_SECRET_ARN=$selected_secret" "REMOVE_LEGACY_NETWORK=$selected_cleanup" "MAINTENANCE_MODE=$selected_maintenance" "COMPACT_RUN_STATE=$selected_compact_state" "RETIRE_LEGACY_DATABASE=$selected_retirement" "ANALYSIS_BATCH_ENABLED=$selected_batch" "GOOGLE_PAGESPEED_SECRET_ARN=$selected_pagespeed" "GOOGLE_CRUX_SECRET_ARN=$selected_crux" >> "$GITHUB_ENV"
      - name: Resolve shared content photo configuration
        shell: bash
        run: |
          set -euo pipefail
          photo_secret_arn="$UNSPLASH_SECRET_ARN"
          if [[ -z "$photo_secret_arn" ]]; then
            photo_secret_arn="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Parameters[?ParameterKey=='UnsplashSecretArn'].ParameterValue | [0]" --output text)"
          fi
          if [[ ! "$photo_secret_arn" =~ ^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+ ]]; then
            echo "Configure UNSPLASH_SECRET_ARN or enable the shared photo service on the existing stack before deployment." >&2
            exit 1
          fi
          echo "UNSPLASH_SECRET_ARN=$photo_secret_arn" >> "$GITHUB_ENV"
      - name: Deploy reviewed backend
        shell: bash
        run: |
          set -euo pipefail
          sam deploy \
            --template-file infra/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --s3-prefix "$STACK_NAME" \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "FrontendOrigin=$FRONTEND_ORIGIN" \
              "DescopeProjectId=$DESCOPE_PROJECT_ID" \
              "DescopeSecretArn=$DESCOPE_SECRET_ARN" \
              "DescopeBaseUrl=$DESCOPE_BASE_URL" \
              "OpenAiSecretArn=$OPENAI_SECRET_ARN" \
              "UnsplashSecretArn=$UNSPLASH_SECRET_ARN" \
              "PerplexitySecretArn=$PERPLEXITY_SECRET_ARN" \
              "GeminiSecretArn=$GEMINI_SECRET_ARN" \
              "GooglePageSpeedSecretArn=$GOOGLE_PAGESPEED_SECRET_ARN" \
              "GoogleCruxSecretArn=$GOOGLE_CRUX_SECRET_ARN" \
              "PerplexityPreset=$PERPLEXITY_PRESET" \
              "GeminiGenerationModel=$GEMINI_GENERATION_MODEL" \
              "GenerationModel=$GENERATION_MODEL" \
              "ContentGenerationModel=$CONTENT_MODEL" \
              "ExtractionModel=$EXTRACTION_MODEL" \
              "ExtractionFallbackModel=$EXTRACTION_FALLBACK_MODEL" \
              "AnalysisBatchEnabled=$ANALYSIS_BATCH_ENABLED" \
              "AnalysisCacheEnabled=$ANALYSIS_CACHE_ENABLED" \
              "WriteCompatibilityResults=$WRITE_COMPATIBILITY_RESULTS" \
              "CompactRunState=$COMPACT_RUN_STATE" \
              "LlmMonthlyBudgetUsd=$LLM_MONTHLY_BUDGET_USD" \
              "AuroraMinCapacity=$AURORA_MIN_CAPACITY" \
              "AuroraAutoPauseSeconds=$AURORA_AUTO_PAUSE_SECONDS" \
              "DatabaseMode=$DATABASE_MODE" \
              "ExternalDatabaseSecretArn=$EXTERNAL_DATABASE_SECRET_ARN" \
              "RemoveLegacyNetwork=$REMOVE_LEGACY_NETWORK" \
              "MaintenanceMode=$MAINTENANCE_MODE" \
              "RetireLegacyDatabase=$RETIRE_LEGACY_DATABASE" \
              "OnboardingModel=$ONBOARDING_MODEL" \
              "AlertEmail=$ALERT_EMAIL" \
              'EnableDevOrigin=false'
      - name: Migrate the private PostgreSQL schema
        if: env.MAINTENANCE_MODE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          scanner_name="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ScannerFunctionName'].OutputValue | [0]" --output text)"
          aws lambda invoke --function-name "$scanner_name" --cli-binary-format raw-in-base64-out --payload '{"kind":"database:migrate"}' /tmp/citevia-migration-result.json > /tmp/citevia-migration-metadata.json
          node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync("/tmp/citevia-migration-metadata.json","utf8"));const r=JSON.parse(fs.readFileSync("/tmp/citevia-migration-result.json","utf8"));if(m.FunctionError||!r.migrated)throw new Error("Database migration failed");console.log("PostgreSQL migrations complete");'
      - name: Show public configuration outputs
        shell: bash
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output json

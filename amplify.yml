version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
        - npm ci --ignore-scripts
    build:
      commands:
        - npm run build --workspace @citevia/client
  artifacts:
    baseDirectory: apps/client/dist
    files:
      - '**/*'
  cache:
    paths:
      - ~/.npm/**/*
